<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>ZEELOT INNOVATION LIMITED | Robotics, Digital Solutions & Emerging Tech</title>
  
  <!-- SEO & Social Meta -->
  <meta name="description" content="Zeelot Innovation Limited bridges industrial robotics, intelligent smart devices, and scalable enterprise software solutions for Nigeria and Africa." />
  <meta name="keywords" content="Zeelot Innovation, Robotics Nigeria, Industrial Automation, Smart Devices, African Tech, Custom Software, AI Devices, Lagos Technology" />
  <meta name="author" content="Praise Bassey, Business Development Department" />
  
  <!-- Favicon / Brand Symbol -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23E51920%22/><text y=%2270%22 x=%2224%22 font-size=%2265%22 font-family=%22sans-serif%22 font-weight=%22bold%22 fill=%22white%22>Z</text></svg>" />

  <!-- Google Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/template2.css" />
</head>
<body class="theme-z1-industrial">

  <!-- DYNAMIC TEMPLATE MOUNT POINT -->
  <div id="templateMountPoint">
    <!-- Populated by js/app.js from data/siteData.js -->
  </div>

  <!-- APPLICATION SCRIPTS -->
  <!-- 1. Centralized Data Store (User requirement: data-based architecture) -->
  <script src="data/siteData.js"></script>

  <!-- 2. High-Tech Visuals & Graphics Generator -->
  <script src="js/graphics.js"></script>

  <!-- 3. Interactive Auto-Overflow Carousel Engine (Mobile Priority) -->
  <script src="js/carousels.js"></script>

  <!-- 4. Floating Multi-Template Switcher (Z1, Z2, Z3) -->
  <script src="js/templateSwitcher.js"></script>

  <!-- 5. Master Application Controller -->
  <script src="js/app.js"></script>

  <!-- Bootstrap App -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize Multi-Template Switcher
      if (window.TemplateEngine) {
        TemplateEngine.init();
      }
      // Initialize Application Renderer
      if (window.ZeelotApp) {
        ZeelotApp.init();
      }
    });
  </script>
</body>
</html>
